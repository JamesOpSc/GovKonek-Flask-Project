<style>
    /* Thinner sidebar (Advise editing base.html margin-left) */
    .sidebar {
        width: 220px; /* Reduced width per request */
        background: #ffffff;
        border-right: 1px solid #e2e8f0;
        padding: 30px 20px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 50;
    }
    .brand {
        color: #1a2a3a;
        font-size: 24px;
        font-weight: 800;
        text-align: center;
        margin-bottom: 50px;
        text-decoration: underline;
        text-decoration-color: #0ea5e9; /* Light blue underline */
        text-underline-offset: 6px;
        text-decoration-thickness: 2px;
    }
    .sidebar-link {
        color: #1f2937;
        padding: 12px 15px;
        border-radius: 8px;
        font-weight: 500;
        transition: all 0.2s ease;
        text-decoration: none;
        display: flex;
        gap: 10px;
        align-items: center;
    }
    .sidebar-link:hover {
        background: #f1f5f9;
        color: #0ea5e9;
    }
    .sidebar-link.active {
        background: #f0f9ff;
        color: #0ea5e9;
        font-weight: 700;
    }
    .btn-logout {
        margin-top: auto;
        background: white;
        color: #ef4444;
        border: 1px solid #ef4444;
        border-radius: 8px;
        padding: 12px;
        width: 100%;
        text-align: center;
        font-weight: 600;
        transition: 0.2s;
    }
    .btn-logout:hover {
        background: #fef2f2;
    }
</style>

<nav class="sidebar">
    <div class="brand">GovKonek</div>
    
    <div style="display: flex; flex-direction: column; gap: 10px;">
        <a href="{{ url_for('dashboard') }}" class="sidebar-link" data-page="dashboard">🏠 Home Dashboard</a>
        <a href="{{ url_for('barangay_map') }}" class="sidebar-link" data-page="barangay_map">🗺️ Barangay Map</a>
        <a href="{{ url_for('projects') }}" class="sidebar-link" data-page="projects">🏗️ Projects</a>
        <a href="{{ url_for('e_services') }}" class="sidebar-link" data-page="services">📄 E-Services</a>
        <a href="{{ url_for('documents') }}" class="sidebar-link" data-page="documents">🔍 Transparency</a>
        <a href="#" class="sidebar-link" data-page="voice">🗣️ Citizens' Voice</a>
    </div>

    <script>
        // Highlight the active sidebar link based on the current URL
        (function() {
            const path = window.location.pathname;
            const links = document.querySelectorAll('.sidebar-link[data-page]');
            links.forEach(link => {
                link.classList.remove('active');
                const page = link.getAttribute('data-page');
                if (page === 'dashboard' && (path === '/dashboard' || path === '/')) {
                    link.classList.add('active');
                } else if (path.includes('/' + page.replace('_', '-'))) {
                    link.classList.add('active');
                } else if (path === '/' + page) {
                    link.classList.add('active');
                }
            });
            // Fallback: if none matched, highlight dashboard
            if (!document.querySelector('.sidebar-link.active')) {
                const dash = document.querySelector('.sidebar-link[data-page="dashboard"]');
                if (dash) dash.classList.add('active');
            }
        })();
    </script>

    <a href="{{ url_for('logout') }}" class="btn-logout">Logout</a>
</nav>
