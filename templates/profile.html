{% extends 'base.html' %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto; background: white; border-radius: 12px; padding: 40px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
    
    <div style="display: flex; align-items: center; gap: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 30px; margin-bottom: 30px;">
        <div style="font-size: 80px; background: var(--background); width: 120px; height: 120px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">👤</div>
        <div>
            <h1 style="font-size: 32px; font-weight: 700; margin-bottom: 5px;">{{ name }}</h1>
            <span style="background: #0ea5e9; color: white; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; text-transform: uppercase;">{{ role }}</span>
        </div>
    </div>

    <h3 style="font-size: 18px; margin-bottom: 15px; color: var(--text-muted);">Verified Citizen Information</h3>
    <p>This is where you will eventually display the user's address, contact number, and uploaded government IDs.</p>
    
    <a href="{{ url_for('dashboard') }}" class="btn" style="margin-top: 30px;">← Back to Dashboard</a>
</div>
{% endblock %}f
